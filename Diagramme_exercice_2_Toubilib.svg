<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .name { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .stereo { font: italic 15px Arial, sans-serif; fill: #dbeafe; }
      .text { font: 16px Consolas, monospace; fill: #172033; }
      .relation { font: 15px Arial, sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .head { fill: #2563eb; }
      .enumhead { fill: #7c3aed; }
      .line { stroke: #334155; stroke-width: 2; fill: none; }
    </style>
    <marker id="diamond" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 5 L 5 0 L 10 5 L 5 10 Z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <g transform="translate(55 105)">
    <rect class="box" width="355" height="350"/>
    <path class="head" d="M8 0 H347 Q355 0 355 8 V68 H0 V8 Q0 0 8 0Z"/>
    <text x="177" y="27" text-anchor="middle" class="stereo">&lt;&lt;entité&gt;&gt;</text>
    <text x="177" y="53" text-anchor="middle" class="name">Patient</text>
    <line x1="0" y1="68" x2="355" y2="68" class="line"/>
    <text x="18" y="98" class="text">- id : string</text>
    <text x="18" y="125" class="text">- nom : string</text>
    <text x="18" y="152" class="text">- prenom : string</text>
    <text x="18" y="179" class="text">- dateNaissance : Date?</text>
    <text x="18" y="206" class="text">- adresse : string?</text>
    <text x="18" y="233" class="text">- codePostal : string?</text>
    <text x="18" y="260" class="text">- ville : string?</text>
    <text x="18" y="287" class="text">- email : string?</text>
    <text x="18" y="314" class="text">- telephone : string</text>
    <line x1="0" y1="326" x2="355" y2="326" class="line"/>
    <text x="18" y="347" class="text">+ consulterRendezVous()</text>
  </g>

  <g transform="translate(990 105)">
    <rect class="box" width="355" height="350"/>
    <path class="head" d="M8 0 H347 Q355 0 355 8 V68 H0 V8 Q0 0 8 0Z"/>
    <text x="177" y="27" text-anchor="middle" class="stereo">&lt;&lt;entité&gt;&gt;</text>
    <text x="177" y="53" text-anchor="middle" class="name">Praticien</text>
    <line x1="0" y1="68" x2="355" y2="68" class="line"/>
    <text x="18" y="98" class="text">- id : string</text>
    <text x="18" y="125" class="text">- nom : string</text>
    <text x="18" y="152" class="text">- prenom : string</text>
    <text x="18" y="179" class="text">- ville : string</text>
    <text x="18" y="206" class="text">- email : string</text>
    <text x="18" y="233" class="text">- telephone : string</text>
    <text x="18" y="260" class="text">- rppsId : string?</text>
    <text x="18" y="287" class="text">- accepteNouveauPatient : bool</text>
    <line x1="0" y1="305" x2="355" y2="305" class="line"/>
    <text x="18" y="334" class="text">+ consulterAgenda()</text>
  </g>

  <g transform="translate(500 105)">
    <rect class="box" width="400" height="500"/>
    <path class="head" d="M8 0 H392 Q400 0 400 8 V68 H0 V8 Q0 0 8 0Z"/>
    <text x="200" y="27" text-anchor="middle" class="stereo">&lt;&lt;entité&gt;&gt;</text>
    <text x="200" y="53" text-anchor="middle" class="name">RendezVous</text>
    <line x1="0" y1="68" x2="400" y2="68" class="line"/>
    <text x="18" y="100" class="text">- id : string</text>
    <text x="18" y="128" class="text">- patient : Patient</text>
    <text x="18" y="156" class="text">- praticien : Praticien</text>
    <text x="18" y="184" class="text">- dateHeureDebut : DateTime</text>
    <text x="18" y="212" class="text">- dateHeureFin : DateTime?</text>
    <text x="18" y="240" class="text">- duree : int</text>
    <text x="18" y="268" class="text">- etat : EtatRendezVous</text>
    <text x="18" y="296" class="text">- dateCreation : DateTime?</text>
    <text x="18" y="324" class="text">- motifVisite : string?</text>
    <line x1="0" y1="344" x2="400" y2="344" class="line"/>
    <text x="18" y="376" class="text">+ annuler() : void</text>
    <text x="18" y="406" class="text">+ honorer() : void</text>
    <text x="18" y="436" class="text">+ marquerNonHonore() : void</text>
    <text x="18" y="466" class="text">+ estPasse() : bool</text>
    <text x="18" y="496" class="text">+ peutEtreAnnule() : bool</text>
  </g>

  <g transform="translate(990 570)">
    <rect class="box" width="355" height="225"/>
    <path class="head" d="M8 0 H347 Q355 0 355 8 V68 H0 V8 Q0 0 8 0Z"/>
    <text x="177" y="27" text-anchor="middle" class="stereo">&lt;&lt;entité&gt;&gt;</text>
    <text x="177" y="53" text-anchor="middle" class="name">Specialite</text>
    <line x1="0" y1="68" x2="355" y2="68" class="line"/>
    <text x="18" y="104" class="text">- id : int</text>
    <text x="18" y="136" class="text">- libelle : string</text>
    <text x="18" y="168" class="text">- description : string?</text>
    <line x1="0" y1="185" x2="355" y2="185" class="line"/>
    <text x="18" y="214" class="text">+ getLibelle() : string</text>
  </g>

  <g transform="translate(55 570)">
    <rect class="box" width="355" height="225"/>
    <path class="enumhead" d="M8 0 H347 Q355 0 355 8 V68 H0 V8 Q0 0 8 0Z"/>
    <text x="177" y="27" text-anchor="middle" class="stereo">&lt;&lt;énumération&gt;&gt;</text>
    <text x="177" y="53" text-anchor="middle" class="name">EtatRendezVous</text>
    <line x1="0" y1="68" x2="355" y2="68" class="line"/>
    <text x="18" y="106" class="text">PLANIFIE = 0</text>
    <text x="18" y="140" class="text">ANNULE = 1</text>
    <text x="18" y="174" class="text">HONORE = 2</text>
    <text x="18" y="208" class="text">NON_HONORE = 3</text>
  </g>

  <path d="M410 280 H500" class="line"/>
  <text x="424" y="268" class="relation">1</text>
  <text x="470" y="268" class="relation">0..*</text>
  <text x="455" y="302" text-anchor="middle" class="relation">concerne</text>

  <path d="M900 280 H990" class="line"/>
  <text x="912" y="268" class="relation">0..*</text>
  <text x="972" y="268" class="relation">1</text>
  <text x="945" y="302" text-anchor="middle" class="relation">assuré par</text>

  <path d="M1167 455 V570" class="line" marker-end="url(#diamond)"/>
  <text x="1182" y="480" class="relation">0..*</text>
  <text x="1182" y="553" class="relation">1</text>
  <text x="1190" y="522" class="relation">exerce</text>

  <path d="M500 540 H455 V682 H410" class="line"/>
  <text x="470" y="560" class="relation">1</text>
  <text x="420" y="670" class="relation">1</text>
  <text x="470" y="635" class="relation">possède</text>
</svg>
